apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: model-gateway-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: {app: model-gateway}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {access: model-gateway}
      ports:
        - {protocol: TCP, port: 4000}
