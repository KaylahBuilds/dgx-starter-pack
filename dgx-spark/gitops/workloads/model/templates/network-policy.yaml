# Enforced only when the cluster CNI implements NetworkPolicy. Admin port-forward
# and host-originated access are not tenant isolation; this is a trusted lab.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: model-service-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: {app: model-service}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: model-gateway}
      ports:
        - {protocol: TCP, port: 8000}
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
          podSelector:
            matchLabels: {app.kubernetes.io/name: prometheus}
      ports:
        - {protocol: TCP, port: 8000}
