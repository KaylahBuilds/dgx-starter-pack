apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dgx-spark-platform
  namespace: argocd
  # Deliberately no cascade-delete finalizer.
spec:
  project: dgx-bootstrap
  source:
    repoURL: https://github.com/KaylahBuilds/dgx-starter-pack.git
    targetRevision: main
    path: dgx-spark/gitops/platform
    helm:
      valueFiles: [values.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
      prune: false
